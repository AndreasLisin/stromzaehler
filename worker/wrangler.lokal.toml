# Nur für Tests auf dem eigenen PC (lokale Datenbank, keine KI, keine echten Daten).
name = "stromzaehler-api-lokal"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "http://localhost:8790,http://127.0.0.1:8790"
AI_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"

[[d1_databases]]
binding = "DB"
database_name = "stromzaehler"
database_id = "00000000-0000-0000-0000-000000000000"
